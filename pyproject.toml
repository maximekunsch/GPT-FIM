[project]
name = "middle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets==2.14.5",
    "pyarrow==14.0.2",
    "filelock>=3.20.0",
    "loguru>=0.7.3",
    "markupsafe>=3.0.3",
    "numpy>=1.26.0, <2.0.0",
    "tiktoken>=0.12.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.57.1",
    "wandb>=0.23.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
